/* =====================================================================
   ГЕОМЕТРИЯ (та же логика, что buildGeo / positionAt в panel.html)
   ===================================================================== */
const R_EARTH = 6371000;
const rad = x => x * Math.PI / 180;
const deg = x => x * 180 / Math.PI;

function distM(a, b) {
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R_EARTH * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function bearingDeg(a, b) {
  const la1 = rad(a.lat), la2 = rad(b.lat), dLo = rad(b.lng - a.lng);
  const y = Math.sin(dLo) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLo);
  return (deg(Math.atan2(y, x)) + 360) % 360;
}

// route: [[lat,lng,speedKmh?,altM?], ...]; скорость/высота точки действуют на отрезок К ней и дальше
function buildGeo(spawn, route, baseSpeedKmh, baseAltM) {
  const pts = [spawn, ...(Array.isArray(route) ? route : [])];
  const segs = [];
  let totalDist = 0, totalTimeS = 0;
  let prevSpeed = Number(baseSpeedKmh) || 0;
  let prevAlt = Number(baseAltM) || 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = { lat: pts[i][0], lng: pts[i][1] };
    const b = { lat: pts[i + 1][0], lng: pts[i + 1][1] };
    const d = distM(a, b);
    const rp = route && route[i];
    const es = Array.isArray(rp) ? Number(rp[2]) : NaN;
    const ea = Array.isArray(rp) ? Number(rp[3]) : NaN;
    const speedKmh = (isFinite(es) && es > 0) ? es : prevSpeed;  prevSpeed = speedKmh;
    const altM     = (isFinite(ea) && ea > 0) ? ea : prevAlt;    prevAlt = altM;
    const mps = speedKmh / 3.6;
    const durS = mps > 0 ? d / mps : 0;
    segs.push({ a, b, d, from: totalDist, fromT: totalTimeS, durS, brng: bearingDeg(a, b), speedKmh, altM });
    totalDist += d; totalTimeS += durS;
  }
  return { pts, segs, totalDist, totalTimeS };
}

function positionAt(geo, t) {
  const last = geo.pts[geo.pts.length - 1];
  if (!geo.segs.length) return { lat: geo.pts[0][0], lng: geo.pts[0][1], heading: 0, speedKmh: 0, altM: 0, seg: 0, done: true };
  const s0 = geo.segs[0], sN = geo.segs[geo.segs.length - 1];
  if (t <= 0) return { lat: geo.pts[0][0], lng: geo.pts[0][1], heading: s0.brng, speedKmh: s0.speedKmh, altM: s0.altM, seg: 0, done: false };
  if (t >= geo.totalTimeS) return { lat: last[0], lng: last[1], heading: sN.brng, speedKmh: sN.speedKmh, altM: sN.altM, seg: geo.segs.length - 1, done: true };
  for (let i = 0; i < geo.segs.length; i++) {
    const s = geo.segs[i];
    if (t <= s.fromT + s.durS) {
      const k = s.durS > 0 ? (t - s.fromT) / s.durS : 0;
      return { lat: s.a.lat + (s.b.lat - s.a.lat) * k, lng: s.a.lng + (s.b.lng - s.a.lng) * k,
               heading: s.brng, speedKmh: s.speedKmh, altM: s.altM, seg: i, done: false };
    }
  }
  return { lat: last[0], lng: last[1], heading: sN.brng, speedKmh: sN.speedKmh, altM: sN.altM, seg: geo.segs.length - 1, done: true };
}

// время полёта до wpIndex-го вайпоинта (для триггеров) — как timeToWpMs в старом index.html
function timeToWpMs(spawn, route, baseSpeed, wpIndex) {
  const g = buildGeo(spawn, route, baseSpeed, 0);
  let t = 0;
  for (let i = 0; i < Math.min(wpIndex, g.segs.length); i++) t += g.segs[i].durS;
  return t * 1000;
}

/* =====================================================================
   ID / ВЫСОТА (логика старого index.html: уникальные, без «666»,
   диапазоны по типу цели, смещение высоты к низу диапазона)
   ===================================================================== */
const usedIds = new Set();
const seq = { shahedA: 9700, shahedB: 9800, plane: 9600, reserve: 8000 };
let fastCounter = 9900;

const idOk = id => id != null && !String(id).includes('666') && !usedIds.has(id);
function randFree(start, end) {
  for (let i = 0; i < 300; i++) {
    const id = start + Math.floor(Math.random() * (end - start + 1));
    if (idOk(id)) { usedIds.add(id); return id; }
  }
  for (let i = start; i <= end; i++) if (idOk(i)) { usedIds.add(i); return i; }
  return null;
}
function seqFree(key, start, end) {
  for (let i = 0; i <= end - start; i++) {
    if (seq[key] > end) seq[key] = start;
    const id = seq[key]++;
    if (idOk(id)) { usedIds.add(id); return id; }
  }
  return null;
}
function pickId(key, start, end) {
  const randomMode = Math.random() < 0.3;
  let id = randomMode ? (randFree(start, end) ?? seqFree(key, start, end))
                      : (seqFree(key, start, end) ?? randFree(start, end));
  if (id == null) id = seqFree('reserve', 8000, 9500) ?? randFree(8000, 9500);
  return id ?? 8000;
}
function generateId(type, speed, label) {
  if (speed > 3000) {                                   // быстрые (баллистика / гиперзвук)
    for (let i = 0; i <= 100; i++) {
      if (fastCounter > 9950) fastCounter = 9900;
      const id = fastCounter++;
      if (idOk(id)) { usedIds.add(id); return id; }
    }
  }
  const t = type || '';
  if (/Гербера|Герань-2/.test(t) || label === 'дрон-имит.' || label === 'уд.дрон') return Math.random() < 0.5 ? pickId('shahedA', 9700, 9799) : pickId('shahedB', 9800, 9899);
  if (/Су-|КАБ/.test(t) || /^(Су-|МиГ-|Ф-16|Ту-|КАБ)/.test(label || '')) return pickId('plane', 9600, 9699);
  return seqFree('reserve', 8000, 9500) ?? randFree(8000, 9500) ?? 8000;   // «8004» и т.п.
}

function classifyTarget(type, speed) {

  const sp = Number(speed) || 0;

  if (h) return typeof h[2] === 'function' ? h[2]() : h[2];
  return typeLabel(type);
}

/* ---------- иконка стрелки: слева белая, справа красная, чёрная обводка ---------- */
function makeArrowImage(col = '#ff7f7f') {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const path = () => { g.beginPath(); g.moveTo(32, 13); g.lineTo(51, 52); g.lineTo(32, 42); g.lineTo(13, 52); g.closePath(); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  path(); g.lineWidth = 16; g.strokeStyle = '#000'; g.stroke();      // чёрная обводка
  path(); g.lineWidth = 9; g.strokeStyle = col; g.stroke();    // скругление
  g.fillStyle = col; g.fill();                                 // красный цвет цели
  return g.getImageData(0, 0, S, S);
}

// силуэт Су-34 (вид сверху, нос вверх) — то же оформление, что у стрелки: чёрная обводка + цвет цели
function makeSu34Image(col = '#ff7f7f') {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const R = [[32,3],[35,7],[37,13],[37.5,22],[38,23],[46,21],[47,24],[38.5,27],[39,31],[58,41],[58,45],[40,50],[39.5,53],[46,57],[46,60],[40,59.5],[39,62],[34.5,62],[33.5,58],[32,63]];
  const pts = R.concat(R.slice(0, -1).reverse().map(([x, y]) => [64 - x, y]));
  const k = 0.7;
  const path = () => {
    g.beginPath();
    pts.forEach(([x, y], i) => { const X = 32 + (x - 32) * k, Y = 32 + (y - 32) * k; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.closePath();
  };
  g.lineJoin = 'round'; g.lineCap = 'round';
  path(); g.lineWidth = 9 * k; g.strokeStyle = '#000'; g.stroke();   // чёрная обводка
  path(); g.lineWidth = 3 * k; g.strokeStyle = col; g.stroke();      // скругление
  g.fillStyle = col; g.fill();
  return g.getImageData(0, 0, S, S);
}

/* ---------- формуляр: очень тёмно-красная плашка + красное свечение ---------- */
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function makeLabelImage(lines, pal) {

  const dpr = 2, M = 14, padX = 7, padY = 4, lh = 14.5, fs = 11.5;
  const font = `600 ${fs}px Manrope, Arial, sans-serif`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const w = Math.ceil(Math.max(...lines.map(t => m.measureText(t).width))) + padX * 2;
  const h = lines.length * lh + padY * 2 - 3;
  const c = document.createElement('canvas');
  c.width = (w + M * 2) * dpr; c.height = (h + M * 2) * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  // свечение (два прохода — ярче)
  g.shadowColor = pal.glow; g.shadowBlur = 6; g.fillStyle = pal.fill;
  rrect(g, M, M, w, h, 3); g.fill();
  g.shadowBlur = 0; g.shadowColor = 'transparent';
  rrect(g, M, M, w, h, 3); g.fill();
  g.lineWidth = 1; g.strokeStyle = pal.border; g.stroke();
  // текст
  g.textBaseline = 'middle';
  lines.forEach((t, i) => {
    const y = M + padY + lh * i + lh / 2 - 2;
    let x = M + padX;
    if (i === 0) {
      const sp = t.indexOf(' ');
      const idPart = sp > 0 ? t.slice(0, sp) : t, rest = sp > 0 ? t.slice(sp) : '';
      // ID — белый, жирный
      g.font = `800 ${fs}px Manrope, Arial, sans-serif`; g.fillStyle = pal.id;
            g.shadowColor = pal.sh; g.shadowBlur = 3;

    }

    g.font = font; g.fillStyle = pal.tx;
    g.shadowColor = pal.sh; g.shadowBlur = 3;
    if (t) g.fillText(t, x, y);
  });
  return { data: g.getImageData(0, 0, c.width, c.height), dpr };
}

/* =====================================================================
   ЦЕЛИ
   ===================================================================== */
const states = new Map();          // key -> state
const liveCache = {};              // live/<key>
const editCache = {};              // targetEdits/<key>
const pendingImgRemove = [];     // имена картинок, которые можно удалить (удаляем с задержкой — см. flushImages)
let dirtyT = true;               // нужно ли перезаливать источники targets/trails в карту
let dirtySel = true;
const IMG_TTL = 6000;
// Картинку удаляем не сразу: воркер карты ещё может раскладывать тайлы по старым данным,
// и если картинки уже нет — все формуляры/стрелки пропадают до следующего обновления.
function flushImages(list) {
  const now = performance.now();
  for (let i = 0; i < list.length;) {
    let it = list[i];
    if (typeof it === 'string') { list[i] = it = { n: it, t: now }; }
    if (now - it.t > IMG_TTL) { if (map.hasImage(it.n)) map.removeImage(it.n); list.splice(i, 1); } else i++;
  }
}
// если стиль/воркер запросил картинку, которой нет — не ломаем слой, отдаём пустую
map.on('styleimagemissing', e => {
  if (!e.id || map.hasImage(e.id)) return;
  map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
});
let imgCounter = 0;
let selectedKey = null;
let callsign = (localStorage.getItem('callsign') || 'virazh').trim() || 'virazh';

function currentAlt(st, now) {
  const p = positionAt(st.geo, (now - st.launchAtMs) / 1000);
  return st.kab ? kabAlt(st, p) : p.altM;
}
// КАБ: высота падает от стартовой до 50 м пропорционально пройденному пути
function kabAlt(st, p) {
  const seg = st.geo.segs[p.seg];
  const done = seg ? seg.from + distM(seg.a, { lat: p.lat, lng: p.lng }) : st.geo.totalDist;
  const f = st.geo.totalDist > 0 ? Math.min(1, done / st.geo.totalDist) : 1;
  return Math.max(50, st.kabStart + (50 - st.kabStart) * f);
}

function spawnTarget(o) {
  if (!mapReady) { setTimeout(() => spawnTarget(o), 200); return; }   // карта ещё грузится
  if (states.has(o.key)) return;
  const speed = Number(o.speed) || 0;
  const route = Array.isArray(o.route) ? o.route : [];
  const label = classifyTarget(o.type, speed);   // тип — по скорости
  const baseAlt = o.kabStart || 0;   // высота — только из маршрута панели (4-й элемент точки)
  const st = {
    key: o.key, type: o.type || '', label,
    id: generateId(o.type, speed, label),
    geo: buildGeo(o.spawn, route, speed, baseAlt),
    launchAtMs: o.launchAtMs, editTs: 0,
    kab: !!o.kabStart, kabStart: o.kabStart || 0,
    lblName: null, lblKey: '', removeTimer: null,
    feature: { type: 'Feature', properties: { key: o.key, heading: 0, lbl: '', ico: 'arrow' }, geometry: { type: 'Point', coordinates: [o.spawn[1], o.spawn[0]] } },
    trail: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[o.spawn[1], o.spawn[0]], [o.spawn[1], o.spawn[0]]] } }
  };
  states.set(o.key, st);
  refreshState(st, srvNow(), true);

  // правки/live, пришедшие раньше, чем цель появилась
  if (editCache[o.key]) applyEdit(st, editCache[o.key]);
  if (liveCache[o.key]) applyLive(st, liveCache[o.key]);
}

function removeTarget(key) {
  const st = states.get(key);
  if (!st) return;
  clearTimeout(st.removeTimer);
  states.delete(key); dirtyT = true;
  if (st.lblName) pendingImgRemove.push(st.lblName);
  if (selectedKey === key) select(null);
}

function setLabel(st, p, alt) {
  const sp = Math.round(p.speedKmh || 0), al = Math.round(alt || 0);
  const k = sp + '|' + al + '|' + callsign;
  if (k === st.lblKey) return;
  st.lblKey = k;
  const lines = al > 0
    ? [`${st.id} ${callsign}`, `${st.label} ${al}м`, `${sp}км/ч`]
    : [`${st.id} ${callsign}`, `${st.label} ${sp}км/ч`];       // высоты нет — две строки
  const img = makeLabelImage(lines);
  const name = 'lbl-' + (++imgCounter);
  map.addImage(name, img.data, { pixelRatio: img.dpr });
  if (st.lblName) pendingImgRemove.push(st.lblName);
  st.lblName = name;
  st.feature.properties.lbl = name;
}

function refreshState(st, now, force) {
  const t = (now - st.launchAtMs) / 1000;
  const p = positionAt(st.geo, t);
  const alt = st.kab ? kabAlt(st, p) : p.altM;
  const c = st.feature.geometry.coordinates;
  c[0] = p.lng; c[1] = p.lat;
  st.feature.properties.heading = p.heading;
  st.feature.properties.spd = p.speedKmh || 0;
  st.feature.properties.ico = (TA_TYPES.test(st.label) && map.hasImage('ta')) ? 'ta' : 'arrow';   // иконка ta.png для Су-34/35/57/30
  setLabel(st, p, alt);

  // след: от старта до текущей позиции
  const coords = [];
  for (let i = 0; i <= p.seg; i++) coords.push([st.geo.pts[i][1], st.geo.pts[i][0]]);
  coords.push([p.lng, p.lat]);
  st.trail.geometry.coordinates = coords;

  st.pos = p; st.alt = alt;
  dirtyT = true; dirtySel = true;
  st.nextUpd = now + 3000;   // следующее обновление маркера и следа — раз в 3 с
  if (p.done && !st.removeTimer && st.geo.segs.length >= 0 && t >= st.geo.totalTimeS) {
    st.removeTimer = setTimeout(() => removeTarget(st.key), 10000);   // долетела — держим 10 с и убираем
  }
}

/* ---------- правка маршрута с панели (targetEdits) ---------- */
function applyEdit(st, ed) {
  if (!ed || !Array.isArray(ed.route) || !ed.route.length) return;
  if ((Number(ed.ts) || 0) <= (st.editTs || 0)) return;
  const now = srvNow();
  const cur = st.alt || currentAlt(st, now);
  const route = ed.route.map(p => [Number(p[0]), Number(p[1]), Number(p[2]) || 0, Number(p[3]) || 0]);
  st.geo = buildGeo([Number(ed.lat), Number(ed.lng)], route, Number(ed.speed) || 0, cur);
  st.launchAtMs = Number(ed.t0) || now;
  st.editTs = Number(ed.ts) || 0;
  st.segOff = 0;
  if (st.removeTimer) { clearTimeout(st.removeTimer); st.removeTimer = null; }
  refreshState(st, now, true);
}

/* ---------- live-позиция с панели (раз в 5 с): подтягиваем при расхождении ---------- */
function applyLive(st, lv) {
  if (!lv || st.kab) return;
  const ts = Number(lv.ts) || 0, lat = Number(lv.lat), lng = Number(lv.lng), seg = Number(lv.seg) || 0;
  if (!isFinite(lat) || !isFinite(lng) || ts < st.launchAtMs) return;
  const exp = positionAt(st.geo, (ts - st.launchAtMs) / 1000);
  if (distM({ lat: exp.lat, lng: exp.lng }, { lat, lng }) < 150) return;   // расхождение мелкое — не трогаем
  const segs = st.geo.segs;
  // seg с панели — номер отрезка в ИСХОДНОМ маршруте, а после каждой подтяжки наш geo укорачивается
  // (начинается с текущего отрезка) — переводим в локальный индекс через segOff
  const local = seg - (st.segOff || 0);
  if (!segs.length || local < 0 || local >= segs.length) return;
  const rest = [];
  for (let i = local; i < segs.length; i++) rest.push([segs[i].b.lat, segs[i].b.lng, segs[i].speedKmh, segs[i].altM]);
  st.geo = buildGeo([lat, lng], rest, segs[local].speedKmh, segs[local].altM);
  st.segOff = seg;
  st.launchAtMs = ts;
  if (st.removeTimer) { clearTimeout(st.removeTimer); st.removeTimer = null; }   // панель говорит, что цель ещё летит
  refreshState(st, srvNow(), true);
}

/* =====================================================================
   ТИКЕР: один проход по целям + один setData на источник
   ===================================================================== */
const tickMs = () => states.size > 400 ? 500 : states.size > 150 ? 250 : 100;
function flushTargets() {
  dirtyT = false;
  const feats = [], trails = [];
  for (const st of states.values()) { if (hiddenCats[targetCat(st)]) continue; feats.push(st.feature); trails.push(st.trail); }
  setData('targets', feats);
  setData('trails', trails);
}
// Удаление долетевших целей по ВРЕМЕНИ, а не по таймеру из refreshState: пока вкладка скрыта,
// refreshState не вызывается и таймер удаления просто не ставился — маркер висел вечно.
const DONE_KEEP_MS = 10000;
function expireDone(now) {
  for (const st of [...states.values()]) {
    if (!st.geo) continue;
    if (now >= st.launchAtMs + st.geo.totalTimeS * 1000 + DONE_KEEP_MS) removeTarget(st.key);
  }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { try { expireDone(srvNow()); } catch (e) { console.error(e); } dirtyT = true; dirtySel = true; }
});
function tick() {
  // любая ошибка внутри тика раньше убивала весь цикл (setTimeout в конце не вызывался) —
  // карта замирала, цели не двигались и не удалялись. Теперь одна кривая цель не ломает остальные.
  try {
    if (mapReady) expireDone(srvNow());   // работает и в фоновой вкладке
    if (mapReady && !document.hidden) {
      const now = srvNow();
      for (const st of states.values()) {
        if (!(now < st.nextUpd)) {
          try { refreshState(st, now); }
          catch (err) { console.error('[tick] цель', st.key, err); st.nextUpd = now + 3000; }
        }
      }
      if (dirtyT) flushTargets();
      updateSelection(now);
      flushImages(pendingImgRemove);
    }
  } catch (err) { console.error('[tick]', err); }
  setTimeout(tick, tickMs());
}

/* =====================================================================
   ВЫБОР ЦЕЛИ / УДАЛЕНИЕ (пишет targetDeletes — панель убирает цель у себя)
   ===================================================================== */
const card = document.getElementById('card');
function select(key) {
  selectedKey = key && states.has(key) ? key : null; dirtySel = true;
  card.style.display = selectedKey ? 'block' : 'none';
  if (!selectedKey) setData('sel', []);
}
function updateSelection(now) {
  const st = selectedKey && states.get(selectedKey);
  if (!st) return;
  const p = st.pos, g = st.geo;
  if (!dirtySel) return;
  dirtySel = false;
  const feats = [];
  feats.push({ type: 'Feature', properties: { kind: 'ring' }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } });
  setData('sel', feats);

  card.innerHTML =
    `<b>${st.id} ${escapeHtml(callsign)}</b><br>` +
    `${escapeHtml(st.label)}<br>` +
    `Скорость: ${Math.round(p.speedKmh || 0)} км/ч` + (st.alt > 0 ? ` · Высота: ${Math.round(st.alt)} м` : '') + `<br>` +
    `<button id="btnDel">Удалить цель</button>`;
  document.getElementById('btnDel').onclick = () => deleteTarget(st.key);
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function deleteTarget(key) {
  const _st = states.get(key);
  if (_st && window._recordKill) { try { window._recordKill(_st); } catch (e) { console.error('[kills]', e); } }   // учёт в «Информации»
  removeTarget(key);
  try { flushTargets(); } catch (e) { console.error('[delete flush]', e); }   // сразу убираем с карты, не ждём тик
  try {
    const ref = db.ref('targetDeletes/' + key);
    ref.set(Date.now());
    setTimeout(() => ref.remove().catch(() => {}), 10000);   // подчищаем запись, чтобы база не росла
  } catch (e) { console.error('[targetDeletes]', e); }
}
window._fbNotifyTargetDeleted = deleteTarget;

map.on('click', e => {
  const f = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });

/* =====================================================================
   FIREBASE → КАРТА (та же логика, что в старом index.html)
   ===================================================================== */
let attached = false;
function attachFirebase() {
  if (attached) return; attached = true;
  const startTime = srvNow();   // слушаем только цели, добавленные ПОСЛЕ открытия страницы

  // 🎯 новые цели
  db.ref('targets').on('child_added', snap => {
    const t = snap.val();
    if (!t || !t.createdAt || t.createdAt < startTime) return;

    const spawnLat = Number(t.spawn && t.spawn[0]), spawnLng = Number(t.spawn && t.spawn[1]);
    if (!isFinite(spawnLat) || !isFinite(spawnLng)) return;
    const speed = Number(t.speed) || 0;
    const delaySec = Number(t.spawnDelay ?? t.delay) || 0;                       // оба названия поля задержки
    const baseAt = Number(t.launchedAt) || Number(t.createdAt) || srvNow();
    const launchAtMs = baseAt + delaySec * 1000;                                  // момент запуска по серверному времени
    const route = Array.isArray(t.route)
      ? t.route.map(pt => [Number(pt[0]), Number(pt[1]), Number(pt[2]) || 0, Number(pt[3]) || 0]) : [];

    setTimeout(() => spawnTarget({ key: snap.key, spawn: [spawnLat, spawnLng], route, speed, type: t.type, launchAtMs }),
               Math.max(0, launchAtMs - srvNow()));

    // ⚡ триггеры (сброс КАБ и т.п.): launchAt + время до вайпоинта + задержка
    if (Array.isArray(t.triggers)) {
      t.triggers.forEach((trig, idx) => {
        const trigSpawn = trig.spawn;
        if (!Array.isArray(trigSpawn) || trigSpawn.length < 2) return;
        const wp = Number(trig.wpIndex) || 0;
        const trigSpeed = Number(trig.speed) || 450;
        const trigDelay = Number(trig.delay) || 12;
        const trigRoute = Array.isArray(trig.route) ? trig.route.map(pt => [Number(pt[0]), Number(pt[1])]) : [];
        const trigAt = launchAtMs + timeToWpMs([spawnLat, spawnLng], route, speed, wp) + trigDelay * 1000;
        setTimeout(() => {
          const parent = states.get(snap.key);
          const startH = parent && parent.alt > 0 ? parent.alt : 0;
          spawnTarget({ key: snap.key + '_trig' + idx, spawn: [Number(trigSpawn[0]), Number(trigSpawn[1])],
                        route: trigRoute, speed: trigSpeed, type: 'КАБ', launchAtMs: trigAt, kabStart: startH });
        }, Math.max(0, trigAt - srvNow()));
      });
    }
  });

  // 📡 live-позиции с панели (раз в 5 с)
  const onLive = s => {
    const lv = s.val(); if (!lv) return;
    liveCache[s.key] = lv;
    const st = states.get(s.key); if (st) applyLive(st, lv);
  };
  db.ref('live').on('child_added', onLive);
  db.ref('live').on('child_changed', onLive);
  db.ref('live').on('child_removed', s => { delete liveCache[s.key]; });

  // ✏️ правки сикеров с панели в реальном времени
  const onEdit = s => {
    const ed = s.val(); if (!ed) return;
    editCache[s.key] = ed;
    const st = states.get(s.key); if (st) applyEdit(st, ed);
  };
  db.ref('targetEdits').on('child_added', onEdit);
  db.ref('targetEdits').on('child_changed', onEdit);
  db.ref('targetEdits').on('child_removed', s => { delete editCache[s.key]; });

  // 🗑 удаление цели с другого клиента
  db.ref('targetDeletes').on('child_added', s => removeTarget(s.key));
}

    menu.innerHTML = `<b>${af}</b>` + Object.keys(TYPES).map(t => `<button class="fb" data-t="${t}">${t}</button>`).join('') + '<button class="fb" id="fback">← назад</button>';

    document.getElementById('fback').onclick = showAirfields;
  }
  btn.onclick = () => {
    if (menu.style.display === 'block') { menu.style.display = 'none'; return; }
    showAirfields(); menu.style.display = 'block'; fcard.style.display = 'none'; sel = null; targeting = false;
  };

  function selectAir(a) {
    sel = a; targeting = false; menu.style.display = 'none';
    if (!a) { fcard.style.display = 'none'; return; }
    fcard.innerHTML = `<b>${a.num} ${a.type}</b><br><span id="fcInfo"></span>` +
      '<button class="fb" id="fbTgt">Выбрать цель</button><button class="fb" id="fbRtb">Вернуться на аэродром</button><button class="fb" id="fbDel">Удалить</button>';
    fcard.style.display = 'block';
    document.getElementById('fbTgt').onclick = () => { targeting = !targeting; document.getElementById('fbTgt').classList.toggle('on', targeting); updCard(); };
    document.getElementById('fbRtb').onclick = () => { targeting = false; command(a, 'rtb'); updCard(); };
    document.getElementById('fbDel').onclick = () => removeAir(a);
    updCard();
  }
  function removeAir(a) {
    const i = air.indexOf(a); if (i < 0) return;
    air.splice(i, 1); airDirty = true; if (a.lbl) oldImgs.push(a.lbl);
    if (sel === a) selectAir(null);
  }
  function updCard() {
    const el = document.getElementById('fcInfo'); if (!el || !sel) return;
    el.textContent = targeting ? 'Нажми на цель на карте' : (sel.d ? `${Math.round(sel.d.v * 3.6)} км/ч · ${Math.round(sel.d.alt)} м` : '');
  }

  /* ---------- создание и команды ---------- */
  function spawn(af, type) {
    const n = air.filter(a => a.af === af).length;
    const base = { lat: AF[af][0], lng: AF[af][1] }, p = off(base, 90, n * 160);
    air.push({ num: ++num, type, af, base, p, h: 0, v: 0, alt: 0, mode: 'idle', ph: '', t: 0, key: null, side: 1, lblKey: '', lbl: '', tt: 0,
      spec: TYPES[type], trail: [[p.lng, p.lat], [p.lng, p.lat]],
      f: { type: 'Feature', properties: { heading: 0, lbl: '', i: num }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } },
      tf: null });
    const a = air[air.length - 1]; airDirty = true;
    a.tf = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: a.trail } };
  }
  function command(a, mode, key) {
    if (a.mode === 'idle' && mode !== 'rtb') {            // взлёт: курс на цель, потом разгон
      const t = key && states.get(key); if (t) a.h = brg(a.p, t.pos);
    }
    if (mode === 'rtb' && a.mode === 'idle') return;
    a.mode = mode; a.key = key || null; a.t = 0; a.side = Math.random() < .5 ? -1 : 1;
    if (mode === 'approach') { a.ph = 'approach'; a.hold = 60 + Math.random() * 120; }   // держится за целью 1–3 минуты
  }

  /* ---------- «лёгкий ИИ» ---------- */
  function steer(a, des, dt) {
    if (a.v < 70) return;                                  // на разбеге не поворачиваем
    const w = 3.5 * (a.mode === 'box' ? .8 : 1);
    a.h = norm(a.h + clamp(dh(a.h, des), -w * dt, w * dt));
  }
  function fly(a, wantV, wantAlt, dt) {
    a.v += clamp(wantV - a.v, -8 * dt, 8 * dt);
    a.alt += clamp(wantAlt - a.alt, -(a.mode === 'rtb' ? 12 : 30) * dt, 30 * dt);
    if (a.v > 0) a.p = off(a.p, a.h, a.v * dt);
  }
  function boxPoints(a) {                                  // «коробочка»: 2 прямые по 9 км, ширина ~9 км (внутри 20 км)
    const c = a.c, u = a.ax, L = 4500, W = 4500;
    return [off(off(c, u, L), u + 90, W), off(off(c, u, -L), u + 90, W), off(off(c, u, -L), u + 90, -W), off(off(c, u, L), u + 90, -W)];
  }
  function step(a, dt) {
    const cr = a.spec.cr / 3.6, mx = a.spec.mx / 3.6, vMin = 420 / 3.6;
    a.t += dt;
    if (a.mode === 'idle') return;
    if (a.mode === 'approach' || a.mode === 'shoot') {
      const tg = states.get(a.key);
      if (!tg || !tg.pos) { a.mode = 'box'; a.c = a.p; a.ax = a.h; a.wi = 0; return; }
      const tp = { lat: tg.pos.lat, lng: tg.pos.lng }, th = tg.pos.heading || 0, tv = (tg.pos.speedKmh || 0) / 3.6;
      const tAlt = clamp(tg.alt || CRUISE_ALT, 150, 12000), d = dst(a.p, tp), rear = Math.abs(dh(th, brg(tp, a.p))) > 130;   // мы в задней полусфере цели
      if (a.ph === 'approach') {
        let aim;
        if (d > 15000) aim = off(tp, th, tv * Math.min(d / cr, 400));            // упреждение
        else aim = off(off(tp, th + 180, 3500), th + 90 * a.side, 700);           // заходим сзади, чуть сбоку
        steer(a, brg(a.p, aim), dt);
        fly(a, d > 15000 ? Math.min(mx, cr * 1.25) : clamp(tv + d / 25, vMin, mx), d > 15000 ? Math.max(tAlt, 1000) : tAlt, dt);
        if (d < 3500 && rear) { a.ph = 'shoot'; a.mode = 'shoot'; a.t = 0; }
      } else {                                                                    // атака: висим сзади ~1.5 км
        steer(a, brg(a.p, off(tp, th + 180, 1500)), dt);
        fly(a, clamp(tv + (d - 1500) * .05, vMin, mx), tAlt, dt);
        if (d > 6000) { a.ph = 'approach'; a.mode = 'approach'; }
        else if (a.t > a.hold) {                                                       // цель уничтожена
          deleteTarget(a.key); a.mode = 'brk'; a.t = 0; a.bh = norm(th + 80 * a.side);
        }
      }
    } else if (a.mode === 'brk') {                                                // уход в сторону
      steer(a, a.bh, dt); fly(a, cr, CRUISE_ALT, dt);
      if (a.t > 25) { a.mode = 'box'; a.c = a.p; a.ax = a.h; a.wi = 0; }
    } else if (a.mode === 'box') {
      const pts = boxPoints(a), w = pts[a.wi % 4];
      steer(a, brg(a.p, w), dt); fly(a, 650 / 3.6, CRUISE_ALT, dt);
      if (dst(a.p, w) < 1500) a.wi++;
    } else if (a.mode === 'rtb') {
      const d = dst(a.p, a.base);
      steer(a, brg(a.p, a.base), dt);
      fly(a, d < 4000 ? clamp(d / 15, 70, 230) : cr, d < 12000 ? clamp(d / 4, 0, CRUISE_ALT) : CRUISE_ALT, dt);
      if (d < 250) a.gone = true;                      // долетел до аэродрома — удаляется
    }
    if (a.mode !== 'idle' && a.v < 70 && a.mode !== 'rtb') {}                   // разбег — просто набираем скорость
  }
  function startFlights(a) { if (a.mode === 'approach' && a.v === 0) a.v = 1; }

  /* ---------- карта ---------- */
  function setup() {
    map.addImage('arrow-blue', makeArrowImage('#6fb4ff'), { pixelRatio: 2 });
    map.addSource('fr-trail', { type: 'geojson', data: EMPTY() });
    map.addSource('fr-src', { type: 'geojson', data: EMPTY() });
    map.addLayer({ id: 'fr-trail', type: 'line', source: 'fr-trail', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#6fb4ff', 'line-width': 1.3 } });
    map.addLayer({ id: 'fr-fast-ring', type: 'circle', source: 'fr-src', filter: ['>', ['get', 'spd'], 1200],
      paint: { 'circle-radius': 19, 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': '#ff2a2a', 'circle-stroke-width': 2 } });
    map.addLayer({ id: 'fr-arrows', type: 'symbol', source: 'fr-src', layout: { 'icon-image': 'arrow-blue', 'icon-size': 0.85,
      'icon-rotate': ['get', 'heading'], 'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
      'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.addLayer({ id: 'fr-labels', type: 'symbol', source: 'fr-src', layout: { 'icon-image': ['get', 'lbl'], 'icon-anchor': 'left', 'icon-offset': [10, 0],
      'icon-rotation-alignment': 'viewport', 'icon-pitch-alignment': 'viewport', 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    // порядок слоёв: формуляры (красные, синие) → кольца → стрелки (красные, синие): маркер всегда поверх формуляра
    map.moveLayer('labels', 'fast-ring'); map.moveLayer('fr-labels', 'fast-ring'); map.moveLayer('fr-fast-ring', 'arrows');
    map.moveLayer('fr-trail', 'trail-line');   // маршрут синих — под формулярами и стрелками, не перекрывает их
    let last = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = Math.min(1800, (now - last) / 1000); last = now;
      const n = Math.max(1, Math.ceil(dt / 0.5));            // симуляция идёт и во вкладке в фоне (с догоном времени)
      air.forEach(a => { for (let i = 0; i < n; i++) step(a, dt / n); });
      for (let i = air.length - 1; i >= 0; i--) if (air[i].gone) removeAir(air[i]);
      if (document.hidden) return;
      air.forEach(a => {
        const t = Date.now();
        if (!(t < a.nextUpd)) {                         // как у красных целей: показ своей авиации обновляется раз в 3 с
          a.nextUpd = t + 3000;
          a.d = { lng: a.p.lng, lat: a.p.lat, h: a.h, alt: a.alt, v: a.v };
          a.f.geometry.coordinates = [a.d.lng, a.d.lat]; a.f.properties.heading = a.d.h; a.f.properties.spd = a.d.v * 3.6;
          a.trail.push([a.d.lng, a.d.lat]); if (a.trail.length > 400) a.trail.shift(); airDirty = true;
        }
        const D = a.d; if (!D) return;
        const k = Math.round(D.alt / 10) + '|' + Math.round(D.v * 3.6 / 10);
        if (k !== a.lblKey) {
          a.lblKey = k;
          const img = makeLabelImage([`${a.num} ${a.type}`, `${Math.round(D.v * 3.6 / 10) * 10}км/ч ${Math.round(D.alt / 10) * 10}м`], PAL);
          const name = 'flbl-' + (++fImg); map.addImage(name, img.data, { pixelRatio: img.dpr });
          if (a.lbl) oldImgs.push(a.lbl); a.lbl = name; a.f.properties.lbl = name; airDirty = true;
        }
      });
      if (airDirty) {
        airDirty = false;
        const fs = map.getSource('fr-src'), ts = map.getSource('fr-trail');
        if (fs) fs.setData({ type: 'FeatureCollection', features: air.map(a => a.f) });
        if (ts) ts.setData({ type: 'FeatureCollection', features: air.map(a => a.tf) });
      }
      flushImages(oldImgs);
      updCard();
    }, 200);
  }
  if (map.loaded()) setup(); else map.on('load', () => { try { document.fonts.load('800 12px Manrope').then(setup, setup); } catch (e) { setup(); } });

  map.on('click', e => {                                   // после общего обработчика красных целей
    const fr = map.queryRenderedFeatures(e.point, { layers: ['fr-arrows', 'fr-labels'] });
    if (fr.length) { select(null); selectAir(air.find(a => a.num === fr[0].properties.i)); return; }
    if (targeting && sel) {
      const red = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });
      if (red.length && states.has(red[0].properties.key)) {
        command(sel, 'approach', red[0].properties.key); startFlights(sel);
        select(null); targeting = false; document.getElementById('fbTgt').classList.remove('on'); updCard(); return;
      }
    }
    targeting = false; sel = null; fcard.style.display = 'none'; menu.style.display = 'none';
  });
})();

/* ---------- кнопка «Информация» (слева снизу): сколько целей уничтожено ---------- */
(function () {
  let kills = {};   // счётчик живёт только в памяти страницы (в localStorage не пишется)
  try { localStorage.removeItem('skymap_kills_v1'); } catch (e) {}   // убрать ранее сохранённый счётчик

  // тип берём из Firebase (поле type цели), но близкие типы считаем вместе
  const groupName = t => {
    t = String(t || '');
    if (/Герань-[45]/.test(t))      return 'Герань-4/5';
    if (/Герань-2|Гербера/.test(t)) return 'Герань-2 / Гербера';
    return t.trim();
  };

  const css = document.createElement('style');
  css.textContent = `
    #ibtn { position: fixed; left: 178px; bottom: 28px; z-index: 6; width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      background: rgba(5, 18, 40, .94); color: #bfe0ff; border: 1px solid rgba(70, 150, 255, .6); font-size: 17px; line-height: 1; }
    #imenu { position: fixed; left: 10px; bottom: 72px; z-index: 6; padding: 8px; display: none; min-width: 230px; max-height: 60vh; overflow-y: auto;
      background: rgba(5, 18, 40, .95); color: #bfe0ff; border: 1px solid rgba(70, 150, 255, .55); border-radius: 10px;
      box-shadow: 0 0 22px rgba(60, 150, 255, .3); font-size: 13px; line-height: 1.45; }
    #imenu b.ih { color: #e6f3ff; font-size: 15px; }
    #imenu .isub { opacity: .7; font-size: 11px; margin-bottom: 6px; }
    #imenu .irow { display: flex; justify-content: space-between; gap: 16px; padding: 4px 0; border-bottom: 1px solid rgba(70, 150, 255, .2); }
    #imenu .irow b { color: #fff; }
    #imenu .itot { border-bottom: 0; margin-top: 2px; font-weight: 800; }
    #imenu .iempty { padding: 4px 0; opacity: .7; }
    #imenu button { display: block; width: 100%; margin-top: 8px; padding: 7px 10px; border: 0; border-radius: 6px; cursor: pointer; text-align: left;
      background: #1c4f96; color: #fff; font: 700 12px 'Manrope', Arial, sans-serif; }`;
  document.head.appendChild(css);

  const btn = document.createElement('button'); btn.id = 'ibtn'; btn.textContent = 'ℹ'; btn.title = 'Информация'; document.body.appendChild(btn);
  const menu = document.createElement('div'); menu.id = 'imenu'; document.body.appendChild(menu);

  function render() {
    const rows = Object.entries(kills).sort((a, b) => b[1] - a[1]);
    const total = rows.reduce((n, r) => n + r[1], 0);
    menu.innerHTML = '<b class="ih">Информация</b><div class="isub">Уничтожено целей (вручную и авиацией)</div>' +
      (rows.length
        ? rows.map(([n, c]) => `<div class="irow"><span>${escapeHtml(n)}</span><b>${c}</b></div>`).join('') +
          `<div class="irow itot"><span>Всего</span><span>${total}</span></div>`
        : '<div class="iempty">Пока ничего не уничтожено</div>') +
      (rows.length ? '<button id="iReset">Сбросить счётчик</button>' : '');
    const r = document.getElementById('iReset');
    if (r) r.onclick = () => { kills = {}; render(); };
  }

  // вызывается из deleteTarget() — и при ручном удалении, и когда цель сбита нашим самолётом
  window._recordKill = st => {
    const name = groupName(st.type) || st.label || 'Другое';
    kills[name] = (kills[name] || 0) + 1;
    if (menu.style.display === 'block') render();
  };

  const closeOthers = () => ['fmenu', 'fcard', 'hmenu', 'hcard', 'smenu', 'card'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  btn.onclick = () => {
    const open = menu.style.display !== 'block';
    if (open) { closeOthers(); render(); }
    menu.style.display = open ? 'block' : 'none';
  };
  ['fbtn', 'sbtn'].forEach(id => document.getElementById(id).addEventListener('click', () => { menu.style.display = 'none'; }));
  map.on('click', () => { menu.style.display = 'none'; });
})();

/* ---------- кнопка «Линейка» (слева снизу): замер расстояний по карте ---------- */
(function () {
  const pts = [];          // [[lng, lat], ...]
  const marks = [];        // html-маркеры (точки и подписи отрезков)
  let active = false, cursorPt = null;

/* ---------- ВЕРТОЛЁТЫ (синие): кнопка → Ми-8 / Ми-24 → клик по карте → «Выбрать цель» (до 250 км/ч) → сопровождение 10–20 мин → сбитие ---------- */
(function () {
  const TYPES = { 'Ми-8': { mx: 260 }, 'Ми-24': { mx: 330 } };   // макс. скорость, км/ч (должна быть выше 250, чтобы догнать цель)
  const MAX_TGT = 250;                                           // выбирать можно только цели не быстрее
  const PAL = { id: '#bfe0ff', tx: '#8fc4ff', fill: 'rgba(3, 12, 30, .97)', border: 'rgba(40, 110, 190, .9)', glow: 'rgba(60, 150, 255, .6)', sh: 'rgba(90, 160, 255, .55)' };
  const RD = Math.PI / 180, MPD = 111320;
  const norm = a => ((a % 360) + 360) % 360, dh = (a, b) => ((b - a + 540) % 360) - 180, clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const offs = (p, h, m) => ({ lat: p.lat + Math.cos(h * RD) * m / MPD, lng: p.lng + Math.sin(h * RD) * m / (MPD * Math.cos(p.lat * RD)) });
  const STATUS = { idle: 'на земле', follow: 'сопровождает цель', patrol: 'ждёт цель (кружит)', hover: 'зависание', land: 'заходит на посадку' };

  const heli = []; const oldImgs = [];
  let sel = null, targeting = false, placing = null, hnum = 2000, hImg = 0, hDirty = true, flashMsg = '', flashTimer = null;

  /* ---------- иконка вертолёта (вид сверху, нос вверх): чёрная обводка + цвет ---------- */
  function makeHeliImage(col = '#6fb4ff') {
    const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
    const body = () => { g.beginPath(); g.ellipse(32, 29, 6, 10.5, 0, 0, Math.PI * 2); };
    const tail = () => { g.beginPath(); g.moveTo(32, 38); g.lineTo(32, 56); g.moveTo(27.5, 56); g.lineTo(36.5, 56); };
    const rotor = () => { g.beginPath(); g.moveTo(15, 12); g.lineTo(49, 46); g.moveTo(49, 12); g.lineTo(15, 46); };
    g.strokeStyle = '#000';
    tail(); g.lineWidth = 7; g.stroke();
    body(); g.lineWidth = 6; g.stroke();
    rotor(); g.lineWidth = 6; g.stroke();
    g.strokeStyle = col; g.fillStyle = col;
    tail(); g.lineWidth = 2.5; g.stroke();
    body(); g.fill();
    rotor(); g.lineWidth = 2.5; g.stroke();
    g.beginPath(); g.arc(32, 29, 2.6, 0, Math.PI * 2); g.fillStyle = '#000'; g.fill();
    return g.getImageData(0, 0, S, S);
  }

  /* ---------- интерфейс ---------- */
  const css = document.createElement('style');

    #hmenu b, #hcard b { color: #e6f3ff; font-size: 15px; }

  document.head.appendChild(css);
  const btn = document.createElement('button'); btn.id = 'hbtn'; btn.title = 'Вертолёты';
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto">' +
    '<path d="M3 5h15M10.5 5v3"/><ellipse cx="10" cy="12.5" rx="6" ry="3.8"/><path d="M16 11.5L22 8.5M22 8v3.5"/><path d="M5.5 19h9M7.5 16.5V19M12.5 16.5V19"/></svg>';

  const menu = document.createElement('div'); menu.id = 'hmenu'; document.body.appendChild(menu);
  const hcard = document.createElement('div'); hcard.id = 'hcard'; document.body.appendChild(hcard);

  const hideOthers = () => ['fmenu', 'fcard', 'smenu', 'imenu', 'rmenu', 'card'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  function stopPlacing() { placing = null; map.getCanvasContainer().classList.remove('heli-place'); }
  function closeAll() { stopPlacing(); targeting = false; sel = null; menu.style.display = 'none'; hcard.style.display = 'none'; }

  function showTypes() {

    updCard();
  }
  function startPatrol(h) {                                   // «коробочка» вокруг точки, где закончил
    const S = 900, p0 = { lat: h.p.lat, lng: h.p.lng }, d = h.h;
    const c1 = offs(p0, d, S), c2 = offs(c1, d + 90, S), c3 = offs(p0, d + 90, S);

  }
  function land(h) {
    if (h.mode === 'idle') return;
    h.mode = 'land'; h.key = null; h.ct = 0;          // гасим скорость, снижаемся до земли
  }
  function removeH(h) {
    const i = heli.indexOf(h); if (i < 0) return;
    heli.splice(i, 1); hDirty = true; if (h.lbl) oldImgs.push(h.lbl);
    if (sel === h) selectH(null);
  }
  function flash(t) { flashMsg = t; clearTimeout(flashTimer); flashTimer = setTimeout(() => { flashMsg = ''; updCard(); }, 3500); updCard(); }
  function updCard() {
    const el = document.getElementById('hcInfo'); if (!el || !sel) return;
    const lb = document.getElementById('hbLand'); if (lb) lb.style.display = (sel.mode === 'idle' || sel.mode === 'land') ? 'none' : '';
    el.textContent = flashMsg ? flashMsg
      : targeting ? `Нажми на цель на карте (до ${MAX_TGT} км/ч)`
      : (sel.d ? `${Math.round(sel.d.v * 3.6)} км/ч · ${Math.round(sel.d.alt)} м` : '');
  }

  /* ---------- создание и команды ---------- */
  function spawn(type, ll) {
    const p = { lat: ll.lat, lng: ll.lng };
    const h = { num: ++hnum, type, spec: TYPES[type], p, h: 0, v: 0, alt: 0, mode: 'idle', key: null, ct: 0, hold: 0, side: 1, off: 160, back: 120, dz: 35,
      lbl: '', lblKey: '', nextUpd: 0, seenPos: null, d: null, trail: [[p.lng, p.lat], [p.lng, p.lat]],
      f: { type: 'Feature', properties: { heading: 0, lbl: '', i: hnum }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } }, tf: null };
    h.tf = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: h.trail } };
    heli.push(h); hDirty = true;
  }
  function liveSpeed(tg) {
    const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000);
    return p.done ? 0 : (p.speedKmh || 0);
  }
  function command(h, key) {
    const tg = states.get(key); if (!tg) return;
    h.mode = 'follow'; h.key = key; h.ct = 0;
    h.hold = 570 + Math.random() * 60;                     // ~10 минут рядом с целью (9:30–10:30), потом сбивает
    h.side = Math.random() < .5 ? -1 : 1;                   // слева или справа от цели
    h.off = 140 + Math.random() * 60;                       // держится в стороне от цели, м
    h.back = 110 + Math.random() * 50;                      // и немного позади цели (по курсу), м
    h.dz = 30 + Math.random() * 20;                         // и выше цели, м
    if (h.v < 1) { const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000); h.h = bearingDeg(h.p, { lat: p.lat, lng: p.lng }); }
  }

  /* ---------- движение ---------- */
  function step(h, dt, tms) {
    if (h.mode === 'idle') return;
    const mx = h.spec.mx / 3.6;
    let wantV = 0, wantAlt = h.alt, wantH = h.h;
    if (h.mode === 'patrol') {
      const c = h.box[h.bi], dx = (c.lng - h.p.lng) * MPD * Math.cos(h.p.lat * RD), dy = (c.lat - h.p.lat) * MPD;
      if (Math.hypot(dx, dy) < 150) h.bi = (h.bi + 1) % 4;
      wantH = norm(Math.atan2(dx, dy) / RD); wantV = Math.min(mx, 110 / 3.6); wantAlt = Math.max(h.alt, 80);
    }
    if (h.mode === 'land') {                                  // посадка: сначала тормозим, потом снижаемся
      wantV = 0; wantAlt = h.v > 3 ? h.alt : 0;
      if (h.v < 1 && h.alt < 1) { h.v = 0; h.alt = 0; h.mode = 'idle'; return; }
    }
    if (h.mode === 'follow') {
      const tg = states.get(h.key);
      if (!tg || !tg.geo) startPatrol(h);                         // цель пропала — «коробочка»
      else {
        const tp = positionAt(tg.geo, (tms - tg.launchAtMs) / 1000);
        const tv = tp.done ? 0 : (tp.speedKmh || 0) / 3.6, th = tp.heading || 0;
        const tAlt = tg.kab ? kabAlt(tg, tp) : (tp.altM || 0);
        const aim = offs(offs({ lat: tp.lat, lng: tp.lng }, th + 90 * h.side, h.off * 0.65), th + 180, h.back || 120);   // чуть сбоку и позади цели
        const dx = (aim.lng - h.p.lng) * MPD * Math.cos(h.p.lat * RD), dy = (aim.lat - h.p.lat) * MPD;
        // скорость цели + поправка на расстояние до точки → подстраивается под цель, вблизи летит с ней «вровень»
        let vx = tv * Math.sin(th * RD) + 0.12 * dx, vy = tv * Math.cos(th * RD) + 0.12 * dy;
        let sp = Math.hypot(vx, vy);

        if (Math.hypot(dx, dy) < 400) h.ct += dt;                                         // отсчёт — с момента, как догнал
        if (h.ct >= h.hold) {                                                             // сбил

        }
      }
    }
    h.v += clamp(wantV - h.v, -8 * dt, 8 * dt);
    h.h = norm(h.h + clamp(dh(h.h, wantH), -60 * dt, 60 * dt));
    h.alt += clamp(wantAlt - h.alt, -6 * dt, 6 * dt);
    if (h.v > 0) h.p = offs(h.p, h.h, h.v * dt);
  }

  /* ---------- карта ---------- */
  function setup() {
    map.addImage('heli-blue', makeHeliImage('#6fb4ff'), { pixelRatio: 2 });
    map.addSource('hl-trail', { type: 'geojson', data: EMPTY() });
    map.addSource('hl-src', { type: 'geojson', data: EMPTY() });
    map.addLayer({ id: 'hl-trail', type: 'line', source: 'hl-trail', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#6fb4ff', 'line-width': 1.3 } });
    map.addLayer({ id: 'hl-labels', type: 'symbol', source: 'hl-src', layout: { 'icon-image': ['get', 'lbl'], 'icon-anchor': 'left', 'icon-offset': [10, 0],
      'icon-rotation-alignment': 'viewport', 'icon-pitch-alignment': 'viewport', 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.addLayer({ id: 'hl-arrows', type: 'symbol', source: 'hl-src', layout: { 'icon-image': 'heli-blue', 'icon-size': 1.2,
      'icon-rotate': ['get', 'heading'], 'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
      'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.moveLayer('hl-labels', 'fast-ring');      // формуляр под стрелками, как у остальных
    map.moveLayer('hl-trail', 'trail-line');      // след под формулярами и стрелками

    let last = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = Math.min(1800, (now - last) / 1000); last = now;
      const n = Math.max(1, Math.ceil(dt / 0.5)), t1 = srvNow();   // симуляция идёт и в фоновой вкладке (с догоном времени)
      heli.forEach(h => { for (let i = 1; i <= n; i++) step(h, dt / n, t1 - dt * 1000 + dt * 1000 * i / n); });
      if (document.hidden) return;
      heli.forEach(h => {
        const t = Date.now();
        const tg = h.mode === 'follow' ? states.get(h.key) : null;
        // при сопровождении обновляем показ ровно тогда, когда обновляется маркер цели — чтобы шли «вместе»; иначе раз в 3 с
        const due = tg ? (tg.pos !== h.seenPos || t > h.nextUpd + 4000) : !(t < h.nextUpd);
        if (due) {
          h.nextUpd = t + 3000; h.seenPos = tg ? tg.pos : null;
          h.d = { lng: h.p.lng, lat: h.p.lat, h: h.h, alt: h.alt, v: h.v };
          h.f.geometry.coordinates = [h.d.lng, h.d.lat]; h.f.properties.heading = h.d.h;
          h.trail.push([h.d.lng, h.d.lat]); if (h.trail.length > 400) h.trail.shift(); hDirty = true;
        }
        const D = h.d; if (!D) return;
        const k = Math.round(D.alt / 10) + '|' + Math.round(D.v * 3.6 / 10);
        if (k !== h.lblKey) {
          h.lblKey = k;
          const img = makeLabelImage([`${h.num} ${h.type}`, `${Math.round(D.v * 3.6 / 10) * 10}км/ч ${Math.round(D.alt / 10) * 10}м`], PAL);
          const name = 'hlbl-' + (++hImg); map.addImage(name, img.data, { pixelRatio: img.dpr });
          if (h.lbl) oldImgs.push(h.lbl); h.lbl = name; h.f.properties.lbl = name; hDirty = true;
        }
      });
      if (hDirty) {
        hDirty = false;
        const fs = map.getSource('hl-src'), ts = map.getSource('hl-trail');
        if (fs) fs.setData({ type: 'FeatureCollection', features: heli.map(h => h.f) });
        if (ts) ts.setData({ type: 'FeatureCollection', features: heli.map(h => h.tf) });
      }
      flushImages(oldImgs);
      updCard();
    }, 200);
  }
  if (map.loaded()) setup(); else map.on('load', () => { try { document.fonts.load('800 12px Manrope').then(setup, setup); } catch (e) { setup(); } });

  map.on('click', e => {
    const rb = document.getElementById('rbtn'); if (rb && rb.classList.contains('on')) return;   // идёт замер линейкой
    if (placing) { spawn(placing, e.lngLat); stopPlacing(); menu.style.display = 'none'; select(null); return; }
    const layers = ['hl-arrows', 'hl-labels'].filter(id => map.getLayer(id));
    const hit = layers.length ? map.queryRenderedFeatures(e.point, { layers }) : [];
    if (hit.length) { select(null); selectH(heli.find(h => h.num === hit[0].properties.i) || null); return; }
    if (targeting && sel) {
      const red = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });
      if (red.length && states.has(red[0].properties.key)) {
        const key = red[0].properties.key, spd = liveSpeed(states.get(key));
        select(null);                                     // карточку красной цели не открываем
        if (spd > MAX_TGT) { flash(`Цель летит ${Math.round(spd)} км/ч — нужна не быстрее ${MAX_TGT}`); return; }
        command(sel, key); targeting = false; document.getElementById('hbTgt').classList.remove('on'); updCard(); return;
      }
    }
    targeting = false; sel = null; hcard.style.display = 'none'; menu.style.display = 'none';
  });
})();

/* ---------- БпЛА-ПЕРЕХВАТЧИК (чёрный): кнопка → клик по карте → «Выбрать цель» (до 300 км/ч) → заходит сзади, ~250 км/ч → таран, исчезает вместе с целью ---------- */
(function () {
  const MAX_TGT = 300;                       // выбирать можно только цели не быстрее, км/ч
  const VMAX = 300 / 3.6;                    // предел скорости перехватчика, м/с (300 км/ч)
  const HIT_P = 0.6;                         // шанс сбить при касании
  const MISS_COOL = 25;                      // после промаха касание не проверяется столько секунд (пролёт мимо)
  const HIT_R = 30;                          // «очень близко» — радиус касания, м
  const TRAIL_BEHIND = 900;                  // точка захода за хвостом цели, м
  const PAL = { id: '#f2f4f8', tx: '#d3d8e0', fill: 'rgba(6, 6, 6, .97)', border: 'rgba(235, 240, 248, .65)', glow: 'rgba(0, 0, 0, .6)', sh: 'rgba(0, 0, 0, 0)' };
  const RD = Math.PI / 180, MPD = 111320;
  const norm = a => ((a % 360) + 360) % 360, dh = (a, b) => ((b - a + 540) % 360) - 180, clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const offs = (p, h, m) => ({ lat: p.lat + Math.cos(h * RD) * m / MPD, lng: p.lng + Math.sin(h * RD) * m / (MPD * Math.cos(p.lat * RD)) });
  const STATUS = { idle: 'на земле', align: 'заходит сзади', strike: 'сближение', hover: 'ждёт цель' };

  const ics = []; const oldImgs = [];
  let sel = null, targeting = false, placing = false, inum = 3000, iImg = 0, iDirty = true, flashMsg = '', flashTimer = null;

  /* ---------- иконка: чёрная стрелка (вид сверху, нос вверх), тонкая светлая кромка, чтобы не терялась ---------- */
  function makeIcImage() {
    const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
    const path = () => { g.beginPath(); g.moveTo(32, 13); g.lineTo(51, 52); g.lineTo(32, 42); g.lineTo(13, 52); g.closePath(); };   // та же форма, что у остальных целей
    path(); g.lineWidth = 14; g.strokeStyle = 'rgba(235, 240, 248, .75)'; g.stroke();   // тонкая светлая кромка
    path(); g.lineWidth = 9; g.strokeStyle = '#000'; g.stroke();
    g.fillStyle = '#000'; g.fill();                                                      // чёрная стрелка
    return g.getImageData(0, 0, S, S);
  }

  /* ---------- интерфейс ---------- */
  const css = document.createElement('style');
  css.textContent = `
    #ubtn { position: fixed; left: 94px; bottom: 28px; z-index: 6; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; padding: 0;
      background: rgba(5, 18, 40, .94); color: #bfe0ff; border: 1px solid rgba(70, 150, 255, .6); }
    #ubtn.on { background: #1f6fe0; border-color: #8fc2ff; }
    #umenu, #ucard { position: fixed; left: 10px; bottom: 72px; z-index: 6; min-width: 200px; padding: 8px; display: none;
      background: rgba(5, 18, 40, .95); color: #bfe0ff; border: 1px solid rgba(70, 150, 255, .55); border-radius: 10px;
      box-shadow: 0 0 22px rgba(60, 150, 255, .3); font-size: 13px; line-height: 1.45; }
    #umenu b, #ucard b { color: #e6f3ff; font-size: 15px; }
    .maplibregl-canvas-container.uav-place .maplibregl-canvas { cursor: crosshair !important; }`;
  document.head.appendChild(css);
  const btn = document.createElement('button'); btn.id = 'ubtn'; btn.title = 'БпЛА Перехв.';
  btn.innerHTML = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto">' +
    '<path d="M12 4L19 20L12 16L5 20Z"/></svg>';
  document.body.appendChild(btn);
  const menu = document.createElement('div'); menu.id = 'umenu'; document.body.appendChild(menu);
  const ucard = document.createElement('div'); ucard.id = 'ucard'; document.body.appendChild(ucard);

  const hideOthers = () => ['fmenu', 'fcard', 'smenu', 'imenu', 'rmenu', 'card', 'hmenu', 'hcard'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
  function stopPlacing() { placing = false; btn.classList.remove('on'); map.getCanvasContainer().classList.remove('uav-place'); }
  function closeAll() { stopPlacing(); targeting = false; sel = null; menu.style.display = 'none'; ucard.style.display = 'none'; }

  function startPlacing() {
    placing = true; btn.classList.add('on');
    menu.innerHTML = '<b>БпЛА Перехв.</b><div style="margin-top:4px">Нажми на карту, где поставить перехватчик</div><button class="fb" id="ucancel">Отмена</button>';
    menu.style.display = 'block';
    document.getElementById('ucancel').onclick = closeAll;
    map.getCanvasContainer().classList.add('uav-place');
  }
  btn.onclick = () => {
    if (placing || menu.style.display === 'block') { closeAll(); return; }
    const rb = document.getElementById('rbtn'); if (rb && rb.classList.contains('on')) rb.click();   // выключаем линейку
    hideOthers(); closeAll(); window.dispatchEvent(new Event('uav-open')); startPlacing();
  };
  // другие кнопки закрывают меню перехватчика
  ['fbtn', 'hbtn', 'sbtn', 'ibtn', 'rbtn'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('click', closeAll); });

  function selectU(h) {
    sel = h; targeting = false; menu.style.display = 'none'; stopPlacing();
    if (!h) { ucard.style.display = 'none'; return; }
    hideOthers();
    ucard.innerHTML = `<b>${h.num} БпЛА Перехв.</b><br><span id="ucInfo"></span>` +
      '<button class="fb" id="ubTgt">Выбрать цель</button><button class="fb" id="ubDel">Удалить</button>';
    ucard.style.display = 'block';
    document.getElementById('ubTgt').onclick = () => { targeting = !targeting; document.getElementById('ubTgt').classList.toggle('on', targeting); updCard(); };
    document.getElementById('ubDel').onclick = () => removeU(h);
    updCard();
  }
  function removeU(h) {
    const i = ics.indexOf(h); if (i < 0) return;
    ics.splice(i, 1); iDirty = true; if (h.lbl) oldImgs.push(h.lbl);
    if (sel === h) selectU(null);
  }
  function flash(t) { flashMsg = t; clearTimeout(flashTimer); flashTimer = setTimeout(() => { flashMsg = ''; updCard(); }, 3500); updCard(); }
  function updCard() {
    const el = document.getElementById('ucInfo'); if (!el || !sel) return;
    el.textContent = flashMsg ? flashMsg
      : targeting ? `Нажми на цель на карте (до ${MAX_TGT} км/ч)`
      : (sel.d ? `${Math.round(sel.d.v * 3.6)} км/ч · ${Math.round(sel.d.alt)} м` : '');
  }

  /* ---------- создание и команды ---------- */
  function spawn(ll) {
    const p = { lat: ll.lat, lng: ll.lng };
    const h = { num: ++inum, p, h: 0, v: 0, alt: 0, mode: 'idle', key: null, vc: (240 + Math.random() * 30) / 3.6, cool: 0,   // крейсерская 270–300 км/ч
      lbl: '', lblKey: '', nextUpd: 0, seenPos: null, d: null, trail: [[p.lng, p.lat], [p.lng, p.lat]],
      f: { type: 'Feature', properties: { heading: 0, lbl: '', i: inum }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } }, tf: null };
    h.tf = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: h.trail } };
    ics.push(h); iDirty = true;
  }
  function liveSpeed(tg) {
    const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000);
    return p.done ? 0 : (p.speedKmh || 0);
  }
  function command(h, key) {
    const tg = states.get(key); if (!tg) return;
    h.mode = 'align'; h.key = key;
    h.chase = 0; h.need = 120 + Math.random() * 120;                  // гоняется минимум 2–4 мин, прежде чем пойти на касание
    if (h.v < 1) { const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000); h.h = bearingDeg(h.p, { lat: p.lat, lng: p.lng }); }
  }
  const loc = (o, p) => [(p.lng - o.lng) * MPD * Math.cos(o.lat * RD), (p.lat - o.lat) * MPD];   // вектор o→p, м (восток, север)

  /* ---------- движение ---------- */
  function step(h, dt, tms) {
    if (h.mode === 'idle') return;
    let wantV = 0, wantAlt = h.alt, wantH = h.h;
    if (h.mode === 'align' || h.mode === 'strike') {
      const tg = states.get(h.key);
      if (!tg || !tg.geo) { h.mode = 'hover'; h.key = null; }              // цель пропала — ждём
      else {
        const t0 = (tms - tg.launchAtMs) / 1000;
        const tp = positionAt(tg.geo, t0);
        const tv = tp.done ? 0 : (tp.speedKmh || 0) / 3.6, th = tp.heading || 0;
        const tAlt = tg.kab ? kabAlt(tg, tp) : (tp.altM || 0);
        const vi = clamp(Math.max(h.vc, tv + 8 / 3.6), 0, VMAX);          // 270–300, быстрее цели (на сколько позволяет предел 300)
        const tpos = { lat: tp.lat, lng: tp.lng };
        const [rx, ry] = loc(tpos, h.p);                                   // где перехватчик относительно цели
        const along = rx * Math.sin(th * RD) + ry * Math.cos(th * RD);     // <0 — позади цели
        const cross = rx * Math.cos(th * RD) - ry * Math.sin(th * RD);
        const dist = Math.hypot(rx, ry);
        // упреждение: где цель будет через время подлёта (по её маршруту)
        let T = dist / vi, fp = tpos, fh = th;
        for (let k = 0; k < 3; k++) { const q = positionAt(tg.geo, t0 + Math.min(T, 1200)); fp = { lat: q.lat, lng: q.lng }; fh = q.heading || th; const [ex, ey] = loc(h.p, fp); T = Math.hypot(ex, ey) / vi; }
        if (h.mode === 'align') {
          if (along < -120 && Math.abs(cross) < 260) h.mode = 'strike';    // встал в хвост — идём в упор
          else if (dist < 80) h.mode = 'strike';
        } else if (along > 60 && dist > 300) h.mode = 'align';             // проскочил вперёд — заходим заново
        const aim = h.mode === 'align' ? offs(fp, fh + 180, TRAIL_BEHIND) : fp;   // точка за хвостом / сама цель
        const [ax, ay] = loc(h.p, aim);
        wantH = norm(Math.atan2(ax, ay) / RD); wantV = vi;
        wantAlt = Math.max(30, tAlt);
        // касание: вплотную по месту и по высоте (проверяем путь за шаг, чтобы не проскочить)
        const [cx, cy] = loc(h.p, tpos), mvx = Math.sin(h.h * RD) * h.v * dt, mvy = Math.cos(h.h * RD) * h.v * dt;
        const tt = clamp((cx * mvx + cy * mvy) / (mvx * mvx + mvy * mvy || 1), 0, 1);
        const miss = Math.hypot(cx - mvx * tt, cy - mvy * tt);
        h.chase = (h.chase || 0) + dt;
        if (h.cool > 0) h.cool -= dt;
        else if (h.chase >= (h.need || 0) && miss < HIT_R && Math.abs(h.alt - tAlt) < 60) {
          if (Math.random() < HIT_P) {
            const k = h.key; removeU(h); deleteTarget(k);                 // таран: перехватчик исчезает, цель сбита
            return;
          }
          h.cool = MISS_COOL; h.mode = 'align'; h.need = h.chase + 60 + Math.random() * 120;   // после промаха ещё 1–3 мин погони                          // промах: проскакивает мимо и заходит заново
        }
      }
    }
    h.v += clamp(wantV - h.v, -12 * dt, 12 * dt);
    h.h = norm(h.h + clamp(dh(h.h, wantH), -50 * dt, 50 * dt));
    h.alt += clamp(wantAlt - h.alt, -35 * dt, 35 * dt);
    if (h.v > 0) h.p = offs(h.p, h.h, h.v * dt);
  }

  /* ---------- карта ---------- */
  function setup() {
    map.addImage('uav-black', makeIcImage(), { pixelRatio: 2 });
    map.addSource('ic-trail', { type: 'geojson', data: EMPTY() });
    map.addSource('ic-src', { type: 'geojson', data: EMPTY() });
    map.addLayer({ id: 'ic-trail', type: 'line', source: 'ic-trail', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#000', 'line-width': 1.3 } });
    map.addLayer({ id: 'ic-labels', type: 'symbol', source: 'ic-src', layout: { 'icon-image': ['get', 'lbl'], 'icon-anchor': 'left', 'icon-offset': [10, 0],
      'icon-rotation-alignment': 'viewport', 'icon-pitch-alignment': 'viewport', 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.addLayer({ id: 'ic-arrows', type: 'symbol', source: 'ic-src', layout: { 'icon-image': 'uav-black', 'icon-size': 0.85,
      'icon-rotate': ['get', 'heading'], 'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
      'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.moveLayer('ic-labels', 'fast-ring');
    map.moveLayer('ic-trail', 'trail-line');

    let last = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = Math.min(1800, (now - last) / 1000); last = now;
      const n = Math.max(1, Math.ceil(dt / 0.5)), t1 = srvNow();
      ics.slice().forEach(h => { for (let i = 1; i <= n && ics.includes(h); i++) step(h, dt / n, t1 - dt * 1000 + dt * 1000 * i / n); });
      if (document.hidden) { flushImages(oldImgs); return; }
      ics.forEach(h => {
        const t = Date.now();
        const tg = (h.mode === 'align' || h.mode === 'strike') ? states.get(h.key) : null;
        const due = tg ? (tg.pos !== h.seenPos || t > h.nextUpd + 4000) : !(t < h.nextUpd);
        if (due) {
          h.nextUpd = t + 3000; h.seenPos = tg ? tg.pos : null;
          h.d = { lng: h.p.lng, lat: h.p.lat, h: h.h, alt: h.alt, v: h.v };
          h.f.geometry.coordinates = [h.d.lng, h.d.lat]; h.f.properties.heading = h.d.h;
          h.trail.push([h.d.lng, h.d.lat]); if (h.trail.length > 400) h.trail.shift(); iDirty = true;
        }
        const D = h.d; if (!D) return;
        const k = Math.round(D.alt / 10) + '|' + Math.round(D.v * 3.6 / 10);
        if (k !== h.lblKey) {
          h.lblKey = k;
          const img = makeLabelImage([`${h.num} БпЛА Перехв.`, `${Math.round(D.v * 3.6 / 10) * 10}км/ч ${Math.round(D.alt / 10) * 10}м`], PAL);
          const name = 'iclbl-' + (++iImg); map.addImage(name, img.data, { pixelRatio: img.dpr });
          if (h.lbl) oldImgs.push(h.lbl); h.lbl = name; h.f.properties.lbl = name; iDirty = true;
        }
      });
      if (iDirty) {
        iDirty = false;
        const fs = map.getSource('ic-src'), ts = map.getSource('ic-trail');
        if (fs) fs.setData({ type: 'FeatureCollection', features: ics.map(h => h.f) });
        if (ts) ts.setData({ type: 'FeatureCollection', features: ics.map(h => h.tf) });
      }
      flushImages(oldImgs);
      updCard();
    }, 200);
  }
  if (map.loaded()) setup(); else map.on('load', () => { try { document.fonts.load('800 12px Manrope').then(setup, setup); } catch (e) { setup(); } });

  map.on('click', e => {
    const rb = document.getElementById('rbtn'); if (rb && rb.classList.contains('on')) return;   // идёт замер линейкой
    if (placing) { spawn(e.lngLat); stopPlacing(); menu.style.display = 'none'; select(null); return; }
    const layers = ['ic-arrows', 'ic-labels'].filter(id => map.getLayer(id));
    const hit = layers.length ? map.queryRenderedFeatures(e.point, { layers }) : [];
    if (hit.length) { select(null); selectU(ics.find(h => h.num === hit[0].properties.i) || null); return; }
    if (targeting && sel) {
      const red = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });
      if (red.length && states.has(red[0].properties.key)) {
        const key = red[0].properties.key, spd = liveSpeed(states.get(key));
        select(null);
        if (spd > MAX_TGT) { flash(`Цель летит ${Math.round(spd)} км/ч — нужна не быстрее ${MAX_TGT}`); return; }
        command(sel, key); targeting = false; document.getElementById('ubTgt').classList.remove('on'); updCard(); return;
      }
    }
    targeting = false; sel = null; ucard.style.display = 'none'; menu.style.display = 'none';
  });
})();
</script>
